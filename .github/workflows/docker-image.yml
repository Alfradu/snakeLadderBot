name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          echo "IMAGE_TAG=slb-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          TOKEN="${{ secrets.TOKEN }}"
          GUILD="${{ secrets.GUILD }}"
          CHANNEL="${{ secrets.CHANNEL }}"
          PORT="${{ secrets.PORT }}"
          API_KEY="${{ secrets.API_KEY }}"
          EOF
        # .env now exists in workspace for Docker build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (includes .env)
        run: |
          docker build . \
            -f Dockerfile \
            --build-arg PORT="${{ secrets.PORT }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/slb:${{ steps.tag.outputs.IMAGE_TAG }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/slb:latest"

      - name: Push both tags
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/slb:${{ steps.tag.outputs.IMAGE_TAG }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/slb:latest"

      - name: Remove .env from runner
        if: always()
        run: |
          shred -u .env || rm -f .env || true
