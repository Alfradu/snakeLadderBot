name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=slb-$(date +%s)" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build . -f Dockerfile -t "${{ secrets.DOCKERHUB_USERNAME }}/slb:${{ steps.tag.outputs.IMAGE_TAG }}" -t "${{ secrets.DOCKERHUB_USERNAME }}/slb:latest"

      - name: Push image (both tags)
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/slb:${{ steps.tag.outputs.IMAGE_TAG }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/slb:latest"
